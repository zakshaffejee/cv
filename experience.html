<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experience | Zakiyyah Haffejee</title>

<style>
:root {
  --dark: #060D0C;
  --deep: #3E5954;
  --sage: #758886;
  --stone: #C6C2BB;
  --light: #F0EDE5;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

body {
  background: var(--light);
  color: var(--dark);
}

nav {
  padding: 20px 8%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: white;
}

nav a {
  text-decoration: none;
  color: var(--deep);
  margin-left: 25px;
  font-weight: 500;
}

nav a:hover {
  color: var(--dark);
}

.page-header {
  padding: 100px 8% 60px;
}

.page-header h1 {
  font-size: 2.5rem;
  color: var(--deep);
}

.timeline {
  border-left: 2px solid var(--deep);
  padding-left: 40px;
  margin: 40px 8% 120px;
}

.timeline-item {
  margin-bottom: 60px;
  position: relative;
}

.timeline-item::before {
  content: "";
  position: absolute;
  left: -49px;
  top: 8px;
  width: 16px;
  height: 16px;
  background: var(--deep);
  border-radius: 50%;
}

.accordion {
  font-size: 1.1rem;
  font-weight: 600;
  cursor: pointer;
  padding: 15px 0;
  transition: 0.3s ease;
}

.accordion:hover {
  color: var(--sage);
}

.panel {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.6s ease;
  background: white;
  margin-top: 15px;
  padding: 0 25px;
  border-radius: 6px;
}

.panel-content {
  padding: 40px 0;
}

.panel h3 {
  margin-top: 30px;
  color: var(--deep);
}

.panel p, .panel li {
  margin-top: 10px;
  color: var(--sage);
  line-height: 1.8;
